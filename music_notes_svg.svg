<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <!-- 实心音符头（椭圆，倾斜） -->
    <g id="filled-notehead">
      <ellipse cx="0" cy="0" rx="7" ry="5.5" transform="rotate(-15)" fill="black"/>
    </g>
    <!-- 空心音符头（二分音符） -->
    <g id="half-notehead">
      <ellipse cx="0" cy="0" rx="7.5" ry="6" transform="rotate(-15)" fill="white" stroke="black" stroke-width="1.3"/>
    </g>
    <!-- 空心音符头（全音符，稍大） -->
    <g id="whole-notehead">
      <ellipse cx="0" cy="0" rx="8.5" ry="6.5" transform="rotate(-15)" fill="white" stroke="black" stroke-width="1.3"/>
    </g>
  </defs>

  <rect width="900" height="1100" fill="white"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" font-family="sans-serif">五线谱音符与休止符对照表</text>

  <!-- 表头 -->
  <text x="80" y="65" text-anchor="middle" font-size="14" font-weight="bold">音符</text>
  <text x="200" y="65" text-anchor="middle" font-size="14" font-weight="bold">符干</text>
  <text x="320" y="65" text-anchor="middle" font-size="14" font-weight="bold">含义</text>
  <text x="480" y="65" text-anchor="middle" font-size="14" font-weight="bold">休止符</text>
  <text x="600" y="65" text-anchor="middle" font-size="14" font-weight="bold">符干</text>
  <text x="720" y="65" text-anchor="middle" font-size="14" font-weight="bold">含义</text>

  <line x1="40" y1="72" x2="860" y2="72" stroke="black" stroke-width="1"/>

  <!-- ===== 第1行: 全音符 / 全休止符 ===== -->
  <g transform="translate(0, 100)">
    <!-- 全音符 -->
    <use href="#whole-notehead" x="80" y="0"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">全音符</text>
    <!-- 全休止符 (倒挂在四线下的小黑矩形) -->
    <rect x="470" y="-12" width="18" height="6" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">全休止符</text>
  </g>

  <!-- ===== 第2行: 附点全音符 / 附点全休止符 ===== -->
  <g transform="translate(0, 140)">
    <use href="#whole-notehead" x="80" y="0"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">附点全音符</text>
    <rect x="470" y="-12" width="18" height="6" fill="black"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">附点全休止符</text>
  </g>

  <!-- ===== 第3行: 双附点全音符 / 双附点全休止符 ===== -->
  <g transform="translate(0, 180)">
    <use href="#whole-notehead" x="80" y="0"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <circle cx="101" cy="-2" r="1.5" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">双附点全音符</text>
    <rect x="470" y="-12" width="18" height="6" fill="black"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <circle cx="501" cy="-2" r="1.5" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">双附点全休止符</text>
  </g>

  <!-- ===== 第4行: 二分音符 / 二分休止符 ===== -->
  <g transform="translate(0, 230)">
    <use href="#half-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">二分音符</text>
    <!-- 二分休止符 (坐在三线上的小黑矩形) -->
    <rect x="470" y="3" width="18" height="6" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">二分休止符</text>
  </g>

  <!-- ===== 第5行: 附点二分音符 / 附点二分休止符 ===== -->
  <g transform="translate(0, 280)">
    <use href="#half-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">附点二分音符</text>
    <rect x="470" y="3" width="18" height="6" fill="black"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">附点二分休止符</text>
  </g>

  <!-- ===== 第6行: 双附点二分音符 / 双附点二分休止符 ===== -->
  <g transform="translate(0, 330)">
    <use href="#half-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <circle cx="101" cy="-2" r="1.5" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">双附点二分音符</text>
    <rect x="470" y="3" width="18" height="6" fill="black"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <circle cx="501" cy="-2" r="1.5" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">双附点二分休止符</text>
  </g>

  <!-- ===== 第7行: 四分音符 / 四分休止符 ===== -->
  <g transform="translate(0, 390)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">四分音符</text>
    <!-- 四分休止符 (Z字形) -->
    <path d="M 475,8 Q 470,0 478,-4 Q 482,-2 478,2 Q 474,6 482,8" stroke="black" stroke-width="2" fill="none"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">四分休止符</text>
  </g>

  <!-- ===== 第8行: 附点四分音符 / 附点四分休止符 ===== -->
  <g transform="translate(0, 440)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">附点四分音符</text>
    <path d="M 475,8 Q 470,0 478,-4 Q 482,-2 478,2 Q 474,6 482,8" stroke="black" stroke-width="2" fill="none"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">附点四分休止符</text>
  </g>

  <!-- ===== 第9行: 双附点四分音符 / 双附点四分休止符 ===== -->
  <g transform="translate(0, 490)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <circle cx="101" cy="-2" r="1.5" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">双附点四分音符</text>
    <path d="M 475,8 Q 470,0 478,-4 Q 482,-2 478,2 Q 474,6 482,8" stroke="black" stroke-width="2" fill="none"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <circle cx="501" cy="-2" r="1.5" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">双附点四分休止符</text>
  </g>

  <!-- ===== 第10行: 八分音符 / 八分休止符 ===== -->
  <g transform="translate(0, 550)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <!-- 符尾 -->
    <path d="M 88,-32 Q 96,-24 88,-16" stroke="black" stroke-width="1.5" fill="none"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">八分音符</text>
    <!-- 八分休止符 -->
    <path d="M 478,5 L 483,-3 L 478,-8 L 473,-3 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">八分休止符</text>
  </g>

  <!-- ===== 第11行: 附点八分音符 / 附点八分休止符 ===== -->
  <g transform="translate(0, 600)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <path d="M 88,-32 Q 96,-24 88,-16" stroke="black" stroke-width="1.5" fill="none"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">附点八分音符</text>
    <path d="M 478,5 L 483,-3 L 478,-8 L 473,-3 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">附点八分休止符</text>
  </g>

  <!-- ===== 第12行: 十六分音符 / 十六分休止符 ===== -->
  <g transform="translate(0, 660)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <path d="M 88,-32 Q 96,-24 88,-16" stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M 88,-26 Q 96,-18 88,-10" stroke="black" stroke-width="1.5" fill="none"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">十六分音符</text>
    <!-- 十六分休止符 -->
    <path d="M 478,5 L 483,-3 L 478,-8 L 473,-3 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <line x1="478" y1="-8" x2="485" y2="-14" stroke="black" stroke-width="1.5"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">十六分休止符</text>
  </g>

  <!-- ===== 第13行: 附点十六分音符 / 附点十六分休止符 ===== -->
  <g transform="translate(0, 710)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <path d="M 88,-32 Q 96,-24 88,-16" stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M 88,-26 Q 96,-18 88,-10" stroke="black" stroke-width="1.5" fill="none"/>
    <circle cx="94" cy="-2" r="2" fill="black"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">附点十六分音符</text>
    <path d="M 478,5 L 483,-3 L 478,-8 L 473,-3 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <line x1="478" y1="-8" x2="485" y2="-14" stroke="black" stroke-width="1.5"/>
    <circle cx="494" cy="-2" r="2" fill="black"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">附点十六分休止符</text>
  </g>

  <!-- ===== 第14行: 三十二分音符 / 三十二分休止符 ===== -->
  <g transform="translate(0, 770)">
    <use href="#filled-notehead" x="80" y="0"/>
    <line x1="88" y1="0" x2="88" y2="-32" stroke="black" stroke-width="1.3"/>
    <path d="M 88,-32 Q 96,-24 88,-16" stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M 88,-26 Q 96,-18 88,-10" stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M 88,-20 Q 96,-12 88,-4" stroke="black" stroke-width="1.5" fill="none"/>
    <text x="200" y="5" text-anchor="middle" font-size="13">向上</text>
    <text x="320" y="5" text-anchor="middle" font-size="13">三十二分音符</text>
    <!-- 三十二分休止符 -->
    <path d="M 478,5 L 483,-3 L 478,-8 L 473,-3 Z" stroke="black" stroke-width="1.5" fill="none"/>
    <line x1="478" y1="-8" x2="485" y2="-14" stroke="black" stroke-width="1.5"/>
    <line x1="478" y1="-14" x2="485" y2="-20" stroke="black" stroke-width="1.5"/>
    <text x="600" y="5" text-anchor="middle" font-size="13">无</text>
    <text x="720" y="5" text-anchor="middle" font-size="13">三十二分休止符</text>
  </g>

  <!-- ===== 底部说明 ===== -->
  <text x="450" y="840" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">附点（·）延长原时值的一半，双附点再延长四分之一</text>
  <text x="450" y="865" text-anchor="middle" font-size="12" fill="#555" font-family="sans-serif">全休止符倒挂在四线下，二分休止符坐在三线上</text>
</svg>